name: gnsh-nightshift-ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: 5.4
      - name: Lua contracts
        run: lua tests/run.lua
      - name: Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find client server shared config tests -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Lua measured coverage
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v luarocks >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y luarocks
          fi
          luarocks --lua-version=5.4 install luacov
          lua -lluacov tests/run.lua
          luacov
          changed=""
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            changed="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- 'client/*.lua' 'client/**/*.lua' 'server/*.lua' 'server/**/*.lua' 'shared/*.lua' 'shared/**/*.lua' 'config/*.lua' 'config/**/*.lua' || true)"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" -- 'client/*.lua' 'client/**/*.lua' 'server/*.lua' 'server/**/*.lua' 'shared/*.lua' 'shared/**/*.lua' 'config/*.lua' 'config/**/*.lua' || true)"
          fi
          if [ -z "$changed" ]; then
            changed="$(git diff --name-only HEAD^ HEAD -- 'client/*.lua' 'client/**/*.lua' 'server/*.lua' 'server/**/*.lua' 'shared/*.lua' 'shared/**/*.lua' 'config/*.lua' 'config/**/*.lua' || true)"
          fi
          if [ -z "$changed" ]; then
            echo 'coverage scope is empty; refusing to claim a coverage gate' >&2
            exit 1
          fi
          scopes=()
          while IFS= read -r path; do
            [ -f "$path" ] || continue
            scopes+=(--scope "$path")
          done <<< "$changed"
          [ "${#scopes[@]}" -gt 0 ] || { echo 'no changed Lua production modules found' >&2; exit 1; }
          python scripts/coverage_gate.py luacov.report.out --minimum 80 "${scopes[@]}"
      - name: Web install and build
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run lint -- --deny-warnings
          npm run build
      - name: Python contract tooling tests
        run: python -m unittest discover -s tests -p '*_test.py' -v
      - name: Migration and locale checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migrations = sorted(Path("sql").glob("[0-9][0-9][0-9]_*.sql"))
          numbers = [int(path.name[:3]) for path in migrations]
          assert migrations, "no SQL migrations found"
          assert numbers == list(range(1, len(numbers) + 1)), numbers

          PY
          python scripts/validate_locales.py
          test "$(find config -maxdepth 1 -type f -name '*.lua' | wc -l)" -gt 0
          python scripts/build_release.py --version 0.0.0-ci --output "$RUNNER_TEMP/gnsh-release"
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/secret_scan.py .
          if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --no-banner --redact; fi
